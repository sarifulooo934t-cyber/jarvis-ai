services:
  - type: web
    name: jarvis-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JARVIS_TOKEN
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: BROWSER_HEADLESS
        value: "1"
